# Threadmark local development stack.
#
# Usage (from the repo root):
#   cp .env.example .env
#   pnpm infra:up      # start everything detached
#   pnpm infra:smoke   # verify connectivity
#   pnpm infra:down    # stop (add -v to also drop volumes)
#
# All credentials come from .env and are LOCAL DEVELOPMENT ONLY.

name: threadmark

services:
  # ── App Postgres: system of record + pgvector ──────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threadmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threadmark_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-threadmark}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-threadmark} -d ${POSTGRES_DB:-threadmark}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Temporal's dedicated Postgres (isolated from the app DB) ───────────────
  temporal-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal_local_dev}
      POSTGRES_DB: temporal
    volumes:
      - temporal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${TEMPORAL_POSTGRES_USER:-temporal} -d temporal']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Temporal server (durable workflow orchestrator) ────────────────────────
  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: unless-stopped
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal_local_dev}
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - '${TEMPORAL_PORT:-7233}:7233'
    healthcheck:
      # Temporal's frontend binds to the container IP (not 127.0.0.1), so probe
      # via $(hostname -i). tctl ships in the auto-setup image.
      test: ['CMD-SHELL', 'tctl --address $$(hostname -i):7233 cluster health | grep -q SERVING']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ── Temporal Web UI ────────────────────────────────────────────────────────
  temporal-ui:
    image: temporalio/ui:2.32.0
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - '${TEMPORAL_UI_PORT:-8233}:8080'

  # ── OpenSearch: lexical (BM25) index ───────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=true # local dev only — no TLS/auth
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - '${OPENSEARCH_PORT:-9200}:9200'
    volumes:
      - os-data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Redis: cache ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── MinIO: S3-compatible blob store for uploaded evidence ──────────────────
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-threadmark}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-threadmark_local_dev}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Jaeger: local trace viewer for @threadmark/telemetry (OTel) spans ──────
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    ports:
      - '${JAEGER_UI_PORT:-16686}:16686'
      - '${JAEGER_OTLP_HTTP_PORT:-4318}:4318'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:16686/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  temporal-pgdata:
  os-data:
  redis-data:
  minio-data:
